<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiragana Flashcards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            max-width: 800px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .flashcard-container {
            perspective: 1000px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
        }

        .flashcard {
            width: 400px;
            height: 250px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.2s;
            cursor: pointer;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: 500;
        }

        .front {
            background: linear-gradient(135deg, #fff 0%, #f8f9fa 100%);
            color: #333;
            border: 3px solid #e9ecef;
        }

        .back {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            transform: rotateY(180deg);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            margin-top: 50px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .nav-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .nav-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
        }

        .action-btn {
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            color: white;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .card-info {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            font-size: 1.1rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .add-card-form {
            background: rgba(255,255,255,0.9);
            padding: 30px;
            border-radius: 15px;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }

        .add-card-form h3 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        textarea, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            resize: vertical;
        }

        textarea:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .hidden {
            display: none;
        }

        .answer-section {
            background: rgba(255,255,255,0.9);
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }

        .answer-input {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: border-color 0.3s ease;
        }

        .answer-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .score-display {
            text-align: center;
            color: white;
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .feedback {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-weight: 600;
            font-size: 1.1rem;
            min-height: 20px;
        }

        .correct {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .incorrect {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .results-section {
            background: rgba(255,255,255,0.9);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            margin: 30px auto;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        .results-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2rem;
        }

        .final-score {
            font-size: 3rem;
            font-weight: bold;
            margin: 20px 0;
        }

        .score-excellent {
            color: #28a745;
        }

        .score-good {
            color: #ffc107;
        }

        .score-needs-improvement {
            color: #dc3545;
        }

        @media (max-width: 600px) {
            .flashcard {
                width: 300px;
                height: 200px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            button {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <h1>📚 Interactive Flashcards</h1>
        
        <div class="card-info">
            <span id="cardCounter">Card 1 of 5</span>
        </div>
        
        <div class="score-display">
            <span id="scoreDisplay">Score: 0 / 0 (0%)</span>
        </div>
        
        <div class="flashcard-container">
            <div class="flashcard" id="flashcard" onclick="flipCard()">
                <div class="card-face front">
                    <p id="frontText">What is the capital of France?</p>
                </div>
                <div class="card-face back">
                    <p id="backText">Paris</p>
                </div>
            </div>
        </div>
        
        <div class="answer-section">
            <input type="text" id="answerInput" class="answer-input" placeholder="Type your answer and press Enter..." onkeypress="handleAnswerInput(event)">
            <div class="feedback" id="feedback"></div>
        </div>
        
        <div class="controls">
            <button class="nav-btn" onclick="previousCard()" id="prevBtn">← Previous</button>
            <button class="action-btn" onclick="skipCard()">Skip Card</button>
            <button class="nav-btn" onclick="nextCard()" id="nextBtn">Next →</button>
        </div>
        
        <div class="controls">
            <button class="action-btn" onclick="toggleAddForm()">Add New Card</button>
            <button class="action-btn" onclick="document.getElementById('fileInput').click()">Load JSON File</button>
            <button class="action-btn" onclick="shuffleCards()">Shuffle Deck</button>
            <button class="action-btn" onclick="resetDeck()">Reset Deck</button>
        </div>
        
        <input type="file" id="fileInput" accept=".json" style="display: none;" onchange="loadJsonFile(event)">
        
        <div class="add-card-form hidden" id="addCardForm">
            <h3>Add New Flashcard</h3>
            <div class="form-group">
                <label for="frontInput">Front (Question):</label>
                <textarea id="frontInput" rows="3" placeholder="Enter the question or prompt..."></textarea>
            </div>
            <div class="form-group">
                <label for="backInput">Back (Answer):</label>
                <textarea id="backInput" rows="3" placeholder="Enter the answer or explanation..."></textarea>
            </div>
            <div class="form-actions">
                <button class="action-btn" onclick="addCard()">Add Card</button>
                <button class="nav-btn" onclick="toggleAddForm()">Cancel</button>
            </div>
        </div>
        
        <div class="results-section hidden" id="resultsSection">
            <h2>🎉 Quiz Complete!</h2>
            <div class="final-score" id="finalScore">85%</div>
            <p id="scoreMessage">Great job! You got 17 out of 20 questions correct.</p>
            <div style="margin-top: 30px;">
                <button class="action-btn" onclick="restartQuiz()" style="margin-right: 10px;">Restart Quiz</button>
                <button class="nav-btn" onclick="hideResults()">Continue Reviewing</button>
            </div>
        </div>
    </div>

    <script>
        let flashcards = [
            { "front": "あ", "back": "a" },
            { "front": "う", "back": "u" },
            { "front": "え", "back": "e" },
            { "front": "お", "back": "o" },
            
            { "front": "か", "back": "ka" },
            { "front": "き", "back": "ki" },
            { "front": "く", "back": "ku" },
            { "front": "け", "back": "ke" },
            { "front": "こ", "back": "ko" },
            
            { "front": "さ", "back": "sa" },
            { "front": "し", "back": "shi" },
            { "front": "す", "back": "su" },
            { "front": "せ", "back": "se" },
            { "front": "そ", "back": "so" },
            
            { "front": "た", "back": "ta" },
            { "front": "ち", "back": "chi" },
            { "front": "つ", "back": "tsu" },
            { "front": "て", "back": "te" },
            { "front": "と", "back": "to" },
            
            { "front": "な", "back": "na" },
            { "front": "に", "back": "ni" },
            { "front": "ぬ", "back": "nu" },
            { "front": "ね", "back": "ne" },
            { "front": "の", "back": "no" },
            
            { "front": "は", "back": "ha" },
            { "front": "ひ", "back": "hi" },
            { "front": "ふ", "back": "fu" },
            { "front": "へ", "back": "he" },
            { "front": "ほ", "back": "ho" },
            
            { "front": "ま", "back": "ma" },
            { "front": "み", "back": "mi" },
            { "front": "む", "back": "mu" },
            { "front": "め", "back": "me" },
            { "front": "も", "back": "mo" },
            
            { "front": "や", "back": "ya" },
            { "front": "ゆ", "back": "yu" },
            { "front": "よ", "back": "yo" },
            
            { "front": "ら", "back": "ra" },
            { "front": "り", "back": "ri" },
            { "front": "る", "back": "ru" },
            { "front": "れ", "back": "re" },
            { "front": "ろ", "back": "ro" },
            
            { "front": "わ", "back": "wa" },
            { "front": "を", "back": "wo" },
            
            { "front": "ん", "back": "n" },
            { "front": "い", "back": "i" }
        ];

        let currentCardIndex = 0;
        let isFlipped = false;
        let score = 0;
        let totalAttempted = 0;
        let answeredCards = new Set();
        let quizMode = true;

        function displayCard() {
            const card = flashcards[currentCardIndex];
            document.getElementById('frontText').textContent = card.front;
            document.getElementById('backText').textContent = card.back;
            document.getElementById('cardCounter').textContent = `Card ${currentCardIndex + 1} of ${flashcards.length}`;
            
            // Reset flip state and clear answer input
            const flashcard = document.getElementById('flashcard');
            flashcard.classList.remove('flipped');
            isFlipped = false;
            
            const answerInput = document.getElementById('answerInput');
            answerInput.value = '';
            answerInput.focus();
            
            // Clear feedback
            const feedback = document.getElementById('feedback');
            feedback.textContent = '';
            feedback.className = 'feedback';
            
            // Update navigation buttons
            document.getElementById('prevBtn').disabled = currentCardIndex === 0;
            document.getElementById('nextBtn').disabled = currentCardIndex === flashcards.length - 1;
            
            // Update score display
            updateScoreDisplay();
        }

        function updateScoreDisplay() {
            const percentage = totalAttempted > 0 ? Math.round((score / totalAttempted) * 100) : 0;
            document.getElementById('scoreDisplay').textContent = `Score: ${score} / ${totalAttempted} (${percentage}%)`;
        }

        function handleAnswerInput(event) {
            if (event.key === 'Enter') {
                checkAnswer();
            }
        }

        function checkAnswer() {
            const userAnswer = document.getElementById('answerInput').value.trim();
            if (!userAnswer) return;
            
            const correctAnswer = flashcards[currentCardIndex].back;
            const feedback = document.getElementById('feedback');
            
            // Simple answer checking (case-insensitive, trimmed)
            const isCorrect = userAnswer.toLowerCase() === correctAnswer.toLowerCase();
            
            // Only count if this card hasn't been answered before
            if (!answeredCards.has(currentCardIndex)) {
                totalAttempted++;
                if (isCorrect) {
                    score++;
                }
                answeredCards.add(currentCardIndex);
            }
            
            if (isCorrect) {
                feedback.textContent = '✓ Correct!';
                feedback.className = 'feedback correct';
            } else {
                feedback.textContent = `✗ Incorrect. The answer is: ${correctAnswer}`;
                feedback.className = 'feedback incorrect';
            }
            
            // Show the answer side of the card
            document.getElementById('flashcard').classList.add('flipped');
            isFlipped = true;
            
            updateScoreDisplay();
            
            // Auto-advance after 2 seconds, or check if quiz is complete
            setTimeout(() => {
                if (answeredCards.size === flashcards.length) {
                    showResults();
                } else if (currentCardIndex < flashcards.length - 1) {
                    nextCard();
                }
            }, 500);
        }

        function skipCard() {
            const feedback = document.getElementById('feedback');
            const correctAnswer = flashcards[currentCardIndex].back;
            
            feedback.textContent = `Skipped. The answer is: ${correctAnswer}`;
            feedback.className = 'feedback incorrect';
            
            // Mark as attempted but incorrect if not already answered
            if (!answeredCards.has(currentCardIndex)) {
                totalAttempted++;
                answeredCards.add(currentCardIndex);
            }
            
            // Show the answer side of the card
            document.getElementById('flashcard').classList.add('flipped');
            isFlipped = true;
            
            updateScoreDisplay();
            
            // Auto-advance after 2 seconds
            setTimeout(() => {
                if (answeredCards.size === flashcards.length) {
                    showResults();
                } else if (currentCardIndex < flashcards.length - 1) {
                    nextCard();
                }
            }, 300);
        }

        function showResults() {
            const percentage = Math.round((score / totalAttempted) * 100);
            const resultsSection = document.getElementById('resultsSection');
            const finalScore = document.getElementById('finalScore');
            const scoreMessage = document.getElementById('scoreMessage');
            
            finalScore.textContent = `${percentage}%`;
            scoreMessage.textContent = `You got ${score} out of ${totalAttempted} questions correct.`;
            
            // Color code the final score
            finalScore.className = 'final-score';
            if (percentage >= 80) {
                finalScore.classList.add('score-excellent');
            } else if (percentage >= 60) {
                finalScore.classList.add('score-good');
            } else {
                finalScore.classList.add('score-needs-improvement');
            }
            
            resultsSection.classList.remove('hidden');
            resultsSection.scrollIntoView({ behavior: 'smooth' });
        }

        function hideResults() {
            document.getElementById('resultsSection').classList.add('hidden');
        }

        function restartQuiz() {
            score = 0;
            totalAttempted = 0;
            answeredCards.clear();
            currentCardIndex = 0;
            hideResults();
            displayCard();
        }

        function flipCard() {
            const flashcard = document.getElementById('flashcard');
            flashcard.classList.toggle('flipped');
            isFlipped = !isFlipped;
        }

        function nextCard() {
            if (currentCardIndex < flashcards.length - 1) {
                currentCardIndex++;
                displayCard();
            }
        }

        function previousCard() {
            if (currentCardIndex > 0) {
                currentCardIndex--;
                displayCard();
            }
        }

        function shuffleCards() {
            for (let i = flashcards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [flashcards[i], flashcards[j]] = [flashcards[j], flashcards[i]];
            }
            currentCardIndex = 0;
            score = 0;
            totalAttempted = 0;
            answeredCards.clear();
            displayCard();
        }

        function resetDeck() {
            flashcards = [
            { "front": "あ", "back": "a" },
            { "front": "う", "back": "u" },
            { "front": "え", "back": "e" },
            { "front": "お", "back": "o" },
            
            { "front": "か", "back": "ka" },
            { "front": "き", "back": "ki" },
            { "front": "く", "back": "ku" },
            { "front": "け", "back": "ke" },
            { "front": "こ", "back": "ko" },
            
            { "front": "さ", "back": "sa" },
            { "front": "し", "back": "shi" },
            { "front": "す", "back": "su" },
            { "front": "せ", "back": "se" },
            { "front": "そ", "back": "so" },
            
            { "front": "た", "back": "ta" },
            { "front": "ち", "back": "chi" },
            { "front": "つ", "back": "tsu" },
            { "front": "て", "back": "te" },
            { "front": "と", "back": "to" },
            
            { "front": "な", "back": "na" },
            { "front": "に", "back": "ni" },
            { "front": "ぬ", "back": "nu" },
            { "front": "ね", "back": "ne" },
            { "front": "の", "back": "no" },
            
            { "front": "は", "back": "ha" },
            { "front": "ひ", "back": "hi" },
            { "front": "ふ", "back": "fu" },
            { "front": "へ", "back": "he" },
            { "front": "ほ", "back": "ho" },
            
            { "front": "ま", "back": "ma" },
            { "front": "み", "back": "mi" },
            { "front": "む", "back": "mu" },
            { "front": "め", "back": "me" },
            { "front": "も", "back": "mo" },
            
            { "front": "や", "back": "ya" },
            { "front": "ゆ", "back": "yu" },
            { "front": "よ", "back": "yo" },
            
            { "front": "ら", "back": "ra" },
            { "front": "り", "back": "ri" },
            { "front": "る", "back": "ru" },
            { "front": "れ", "back": "re" },
            { "front": "ろ", "back": "ro" },
            
            { "front": "わ", "back": "wa" },
            { "front": "を", "back": "wo" },
            
            { "front": "ん", "back": "n" },
            { "front": "い", "back": "i" }
            ];
            currentCardIndex = 0;
            score = 0;
            totalAttempted = 0;
            answeredCards.clear();
            displayCard();
        }

        function toggleAddForm() {
            const form = document.getElementById('addCardForm');
            form.classList.toggle('hidden');
            
            if (!form.classList.contains('hidden')) {
                document.getElementById('frontInput').focus();
            } else {
                // Clear form
                document.getElementById('frontInput').value = '';
                document.getElementById('backInput').value = '';
            }
        }

        function loadJsonFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            if (!file.name.toLowerCase().endsWith('.json')) {
                alert('Please select a JSON file.');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const jsonData = JSON.parse(e.target.result);
                    
                    // Validate JSON structure
                    if (!Array.isArray(jsonData)) {
                        throw new Error('JSON must be an array of objects');
                    }
                    
                    // Validate each flashcard object
                    const validCards = [];
                    for (let i = 0; i < jsonData.length; i++) {
                        const card = jsonData[i];
                        if (typeof card === 'object' && card !== null && 
                            typeof card.front === 'string' && typeof card.back === 'string' &&
                            card.front.trim() !== '' && card.back.trim() !== '') {
                            validCards.push({
                                front: card.front.trim(),
                                back: card.back.trim()
                            });
                        } else {
                            console.warn(`Skipping invalid card at index ${i}:`, card);
                        }
                    }
                    
                    if (validCards.length === 0) {
                        alert('No valid flashcards found in the JSON file. Each card must have "front" and "back" properties with non-empty strings.');
                        return;
                    }
                    
                    flashcards = validCards;
                    currentCardIndex = 0;
                    score = 0;
                    totalAttempted = 0;
                    answeredCards.clear();
                    displayCard();
                    
                    alert(`Successfully loaded ${validCards.length} flashcard(s) from ${file.name}`);
                    
                } catch (error) {
                    alert(`Error reading JSON file: ${error.message}\n\nPlease ensure your JSON file follows this format:\n[{"front": "Question", "back": "Answer"}]`);
                }
            };
            
            reader.onerror = function() {
                alert('Error reading file. Please try again.');
            };
            
            reader.readAsText(file);
            
            // Clear the input so the same file can be loaded again
            event.target.value = '';
        }

        function addCard() {
            const front = document.getElementById('frontInput').value.trim();
            const back = document.getElementById('backInput').value.trim();
            
            if (front && back) {
                flashcards.push({ front, back });
                toggleAddForm();
                displayCard();
                alert('Card added successfully!');
            } else {
                alert('Please fill in both front and back of the card.');
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', function(event) {
            // Don't interfere when typing in input fields
            if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') {
                return;
            }
            
            switch(event.key) {
                case 'ArrowLeft':
                    previousCard();
                    break;
                case 'ArrowRight':
                    nextCard();
                    break;
                case ' ':
                    event.preventDefault();
                    skipCard();
                    break;
            }
        });

        // Initialize
        displayCard();
    </script>
</body>
</html>
